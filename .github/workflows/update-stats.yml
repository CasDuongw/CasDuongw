name: Auto Update System Telemetry

on:
  schedule:
    # Chạy tự động mỗi 4 tiếng
    - cron: '0 */4 * * *' 
  workflow_dispatch: # Hiển thị nút bấm để bạn có thể chạy thủ công bất cứ lúc nào
  push:
    branches: [ "main", "master" ] # Tự động chạy khi bạn có thay đổi mới trong repo này

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Stats Images
        run: |
          curl -o main-stats.svg "https://github-readme-stats.vercel.app/api?username=LilDuong&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0d1117&count_private=true"
          curl -o streak-stats.svg "https://streak-stats.demolab.com/?user=LilDuong&theme=tokyonight&hide_border=true&background=0d1117"
          curl -o top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=LilDuong&layout=compact&theme=tokyonight&hide_border=true&bg_color=0d1117"

      - name: Commit & Push to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg
          git commit -m "Auto-update system telemetry [skip ci]" || echo "No changes to commit"
          git push
